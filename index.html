    :root {
      --bg: #000000;
      --text: #ffffff;
      --pad: 4vw;
      color-scheme: dark;
    }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: var(--pad);
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
      background: var(--bg);
      color: var(--text);
      font-family: "Fixedsys Excelsior Web", Fixedsys, "Lucida Console", Consolas, monospace;
      font-weight: normal;
      font-synthesis: none;
      font-kerning: none;
      font-variant-ligatures: none;
    }

    /* Each character is exactly half an em wide, so a line of N characters
       is N / 2 em wide. Font size = available width / (N / 2) makes every
       line span the full width. */
    main {
      container-type: inline-size;
    }

    h1, p {
      margin: 0;
      font-size: calc((100vw - 2 * var(--pad)) / 17.5);
      font-size: calc(100cqw / 17.5);
      font-weight: normal;
      line-height: 1.25;
      white-space: nowrap;
    }

    p {
      margin-top: 1.5rem;
      font-size: calc((100vw - 2 * var(--pad)) / 21);
      font-size: calc(100cqw / 21);
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    a:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 0.15em;
    }

    /* Image reel: one slide at a time, full width, blurred until loaded */
    .reel {
      margin-top: 2rem;
    }

    .reel-frame {
      position: relative;
      overflow: hidden;
      background: #000000;
      aspect-ratio: var(--ar, 16 / 9);
      transition: aspect-ratio 0.9s ease;
    }

    .slide {
      position: absolute;
      inset: 0;
      margin: 0;
      opacity: 0;
      visibility: hidden;
      filter: blur(24px);
      transition: opacity 0.9s ease, filter 0.9s ease, visibility 0s linear 0.9s;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      filter: none;
      transition: opacity 0.9s ease, filter 0.9s ease, visibility 0s;
    }

    .slide img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Tiny preview, enlarged and blurred, shown until the full GIF arrives */
    .ph {
      filter: blur(16px);
      transform: scale(1.15);
    }

    .full {
      opacity: 0;
      filter: blur(20px);
      transition: opacity 0.9s ease, filter 0.9s ease;
    }

    .slide.is-loaded .full {
      opacity: 1;
      filter: none;
    }

    .slide.is-loaded .ph {
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    /* Reduced motion: no cycling or fades; slides stack and sit still */
    .reel.static .reel-frame {
      display: grid;
      gap: 1rem;
      overflow: visible;
      aspect-ratio: auto;
      background: none;
      transition: none;
    }

    .reel.static .slide {
      position: relative;
      overflow: hidden;
      aspect-ratio: var(--ar);
      background: #000000;
      opacity: 1;
      visibility: visible;
      filter: none;
      transition: none;
    }

    .reel.static .full,
    .reel.static .ph {
      transition: none;
    }
  </style>
</head>

  <script>
    (() => {
      const reel = document.querySelector('.reel');
      if (!reel) return;

      const frame = reel.querySelector('.reel-frame');
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const items = [...reel.querySelectorAll('.slide')].map((el) => ({
        el,
        img: el.querySelector('.full'),
        ready: false,
        failed: false,
        dwell: Number(el.dataset.dwell) || 8000
      }));

      let current = -1;
      let timer = null;

      reel.hidden = false;
      if (still) reel.classList.add('static');

      const live = () => items.filter((it) => !it.failed);

      function schedule() {
        clearTimeout(timer);
        if (still || live().length < 2) return;
        timer = setTimeout(advance, items[current].dwell);
      }

      function show(i) {
        current = i;
        frame.style.setProperty('--ar', items[i].el.style.getPropertyValue('--ar'));
        void frame.offsetWidth; // commit the starting state so the transition runs
        items.forEach((it, n) => it.el.classList.toggle('active', n === i));
        if (items[i].ready) schedule(); else clearTimeout(timer);
      }

      function advance() {
        for (let step = 1; step <= items.length; step++) {
          const n = (current + step) % items.length;
          if (!items[n].failed) { show(n); return; }
        }
      }

      // Load one GIF at a time so the first slide gets the full connection
      function load(i) {
        if (i >= items.length) return;
        const it = items[i];

        it.img.addEventListener('load', () => {
          it.ready = true;
          it.el.classList.add('is-loaded');
          if (i === current) schedule();
          load(i + 1);
        }, { once: true });

        it.img.addEventListener('error', () => {
          it.failed = true;
          it.el.hidden = true;
          if (!live().length) { reel.hidden = true; return; }
          if (i === current) advance();
          load(i + 1);
        }, { once: true });

        it.img.src = it.img.dataset.src;
      }

      if (!still) show(0);
      load(0);
    })();
  </script>
